name: DiscordLink
version: '1.6.7'
main: clre20.discordLink.DiscordLink
api-version: '1.21'
prefix: DiscordLink
authors: [ Clre20 ]
description: A Discord Link plugin

commands:
  discordlink:
    description: DiscordLink 系統指令
    aliases: [dclink]

permissions:
  discordlink.admin:
    description: 允許管理 DiscordLink 系統 (例如 bypass, reload 等指令)
    default: op
  discordlink.use:
    description: 允許玩家自己進行驗證綁定 (例如 link 指令)
    default: true
